databases:
  - name: solarvision-db
    databaseName: solarvision
    user: solarvision_user
    plan: free

services:
  - type: web
    name: solarvision-backend
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn solarvision_api.wsgi:application"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solarvision-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

  - type: web
    name: solarvision-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: solarvision-backend
          property: host
        # The frontend needs https:// prefixed for API calls, so Render sets VITE_API_URL appropriately, but we usually just construct it if the property doesn't give protocol. Actually, Render 'host' does NOT include protocol. We will handle prefixing in React, or just set it manually via dashboard. For simplicity, we'll let the user set it or prefix https:// in code.
